repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.10.1
    hooks:
      - id: ansible-lint
  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        entry: scripts/validate-k8s.sh
        language: system
        pass_filenames: false
        files: ^(platform|apps|bootstrap)/.*\.yaml$
