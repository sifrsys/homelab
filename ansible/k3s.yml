---
# Phase 2: k3s with embedded etcd on all three hosts.
# The k3s_init host (hal) starts the cluster; the others join one at a time.
- name: Start the cluster on the first server
  hosts: k3s_init
  become: true
  tasks:
    - name: Install k3s server
      ansible.builtin.import_tasks: tasks/k3s-server.yml

- name: Join the other servers one at a time
  hosts: k3s:!k3s_init
  serial: 1
  become: true
  tasks:
    - name: Install k3s server
      ansible.builtin.import_tasks: tasks/k3s-server.yml
