---
# Smoke test for the k3s cluster: nodes, pod network across nodes, cluster DNS.
- name: Verify the k3s cluster
  hosts: k3s_init
  become: true
  vars:
    kubectl: /usr/local/bin/k3s kubectl
  tasks:
    - name: Show nodes
      ansible.builtin.command: "{{ kubectl }} get nodes -o wide"
      register: nodes
      changed_when: false

    - name: Print nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines

    - name: Run the network test and always clean up
      block:
        - name: Start one test pod on every node
          ansible.builtin.command:
            cmd: "{{ kubectl }} apply -f -"
            stdin: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: nettest
                namespace: default
              spec:
                selector:
                  matchLabels:
                    app: nettest
                template:
                  metadata:
                    labels:
                      app: nettest
                  spec:
                    tolerations:
                      - operator: Exists
                    containers:
                      - name: busybox
                        image: busybox:1.36
                        command: ["sleep", "3600"]
          changed_when: true

        - name: Wait until all test pods run
          ansible.builtin.command: "{{ kubectl }} rollout status daemonset/nettest --timeout=180s"
          changed_when: false

        - name: Ping every test pod from every other test pod
          ansible.builtin.shell: |
            set -eo pipefail
            pods=$({{ kubectl }} get pods -l app=nettest -o jsonpath='{range .items[*]}{.metadata.name},{.spec.nodeName},{.status.podIP}{"\n"}{end}')
            echo "$pods"
            for from in $pods; do
              fname=${from%%,*}; rest=${from#*,}; fnode=${rest%%,*}
              for to in $pods; do
                tnode=$(echo "$to" | cut -d, -f2); tip=${to##*,}
                [ "$fnode" = "$tnode" ] && continue
                if {{ kubectl }} exec "$fname" -- ping -c 2 -W 2 "$tip" >/dev/null 2>&1; then
                  echo "OK   $fnode -> $tnode ($tip)"
                else
                  echo "FAIL $fnode -> $tnode ($tip)"; failed=1
                fi
              done
            done
            [ -z "$failed" ]
          args:
            executable: /bin/bash
          register: ping
          changed_when: false

        - name: Print ping results
          ansible.builtin.debug:
            var: ping.stdout_lines

        - name: Resolve a name with cluster DNS
          ansible.builtin.shell: |
            pod=$({{ kubectl }} get pods -l app=nettest -o jsonpath='{.items[0].metadata.name}')
            {{ kubectl }} exec "$pod" -- nslookup kubernetes.default.svc.cluster.local
          register: dns
          changed_when: false

        - name: Print DNS result
          ansible.builtin.debug:
            var: dns.stdout_lines
      always:
        - name: Remove the test pods
          ansible.builtin.command: "{{ kubectl }} delete daemonset nettest --ignore-not-found"
          changed_when: true
