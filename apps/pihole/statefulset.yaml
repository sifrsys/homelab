---
# Two Pi-hole replicas (HAL + NUC), each with its own Unbound. No Longhorn: DNS must not depend on storage;
# nebula-sync restores lists and local records after every restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pihole
spec:
  serviceName: pihole
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["rpi4"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: pihole
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pihole
          image: pihole/pihole:2026.10.0@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
          # FTLCONF_ settings are locked: the web UI and nebula-sync cannot change them.
          env:
            - name: TZ
              value: Europe/Amsterdam
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-secrets
                  key: web-password
            - name: FTLCONF_dns_upstreams
              value: "127.0.0.1#5335"
            - name: FTLCONF_dns_listeningMode
              value: "ALL"
            - name: FTLCONF_dhcp_active
              value: "false"
            - name: FTLCONF_ntp_ipv4_active
              value: "false"
            - name: FTLCONF_ntp_ipv6_active
              value: "false"
            - name: FTLCONF_ntp_sync_active
              value: "false"
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: etc-pihole
              mountPath: /etc/pihole
        - name: unbound
          image: mvance/unbound:1.22.0@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: unbound-config
              mountPath: /opt/unbound/etc/unbound/unbound.conf
              subPath: unbound.conf
              readOnly: true
            - name: unbound-var
              mountPath: /opt/unbound/etc/unbound/var
      volumes:
        - name: etc-pihole
          emptyDir: {}
        - name: unbound-config
          configMap:
            name: unbound-config
        - name: unbound-var
          emptyDir: {}
