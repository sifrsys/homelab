# KSOPS: decrypt the Pi-hole web password and the sync credentials during the kustomize build in Argo CD.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./pihole-secrets.sops.yaml
