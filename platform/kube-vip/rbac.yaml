# Least-privilege RBAC for kube-vip in control-plane-only mode (ARP + leader election).
# Replaces the upstream rbac.yaml, which also grants Service/Endpoint rights for
# service load balancing (we use MetalLB for that).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
---
# Leader election: only the lease in kube-system (cp_namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-vip-leases
  namespace: kube-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-vip-leases
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-vip-leases
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
---
# Read-only view of nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip-nodes
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
