# kube-vip for the API VIP 192.168.2.210 on node nuc (interface eno1).
# One DaemonSet per node because the interface names differ; all three share
# the same leader-election lease (plndr-cp-lock), so only one node holds the VIP.
# Generated with: kube-vip v1.3.1 manifest daemonset --controlplane --arp --leaderElection --inCluster --taint
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-nuc
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/instance: kube-vip-nuc
    app.kubernetes.io/version: v1.3.1
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
      app.kubernetes.io/instance: kube-vip-nuc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
        app.kubernetes.io/instance: kube-vip-nuc
        app.kubernetes.io/version: v1.3.1
    spec:
      nodeSelector:
        kubernetes.io/hostname: nuc
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.3.1
          imagePullPolicy: IfNotPresent
          args:
            - manager
          env:
            - name: vip_arp
              value: "true"
            - name: port
              value: "6443"
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: vip_interface
              value: eno1
            - name: vip_subnet
              value: "32"
            - name: dns_mode
              value: first
            - name: dhcp_mode
              value: ipv4
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: kube-system
            - name: vip_leaderelection
              value: "true"
            - name: vip_leasename
              value: plndr-cp-lock
            - name: vip_leaseduration
              value: "15"
            - name: vip_renewdeadline
              value: "10"
            - name: vip_retryperiod
              value: "2"
            - name: address
              value: 192.168.2.210
            - name: prometheus_server
              value: :2112
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
              drop:
                - ALL
      hostNetwork: true
      serviceAccountName: kube-vip
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
