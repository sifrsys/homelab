# Argo CD Helm values for the homelab cluster.
# Chart: argo/argo-cd 10.11.6 (Argo CD v3.5.6).
# Only differences from the chart defaults live here.

# No SSO yet: log in with the local admin account only.
dex:
  enabled: false

# No alert channel yet.
notifications:
  enabled: false

# KSOPS: decrypt SOPS-encrypted Kubernetes secrets during kustomize builds.
configs:
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

repoServer:
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /sops-age
      name: sops-age
      readOnly: true
