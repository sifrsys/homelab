# Argo CD Helm values for the homelab cluster.
# Chart: argo/argo-cd 10.11.6 (Argo CD v3.5.6).
# Only differences from the chart defaults live here.

# Public URL of the UI (LAN-only name, served by Traefik).
global:
  domain: argocd.home.sifrsys.dev

# No SSO yet: log in with the local admin account only.
dex:
  enabled: false

# No alert channel yet.
notifications:
  enabled: false

configs:
  # TLS ends at Traefik (wildcard cert); argocd-server speaks plain HTTP behind it.
  params:
    server.insecure: true
  # KSOPS: decrypt SOPS-encrypted Kubernetes secrets during kustomize builds.
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

# UI via Traefik on the LAN only (no public DNS, no port forward).
server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"

repoServer:
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /sops-age
      name: sops-age
      readOnly: true
