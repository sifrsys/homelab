# Temporary Application to prove the GitOps loop. Removed after the test.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:sifrsys/homelab.git
    targetRevision: main
    path: platform/gitops-test
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
