# Temporary: proves Argo CD can decrypt SOPS secrets via KSOPS. Removed after the test.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:sifrsys/homelab.git
    targetRevision: main
    path: platform/sops-test
  destination:
    server: https://kubernetes.default.svc
    namespace: sops-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
