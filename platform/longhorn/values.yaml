# Longhorn Helm values. Chart: longhorn/longhorn 1.13.0 (Longhorn v1.13.0).

defaultSettings:
  # Only nodes labelled node.longhorn.io/create-default-disk=true (hal, nuc) store data.
  # The Pi's USB 2.0 disk is too slow; Pi pods still use volumes over the network. Until upgrade HAL + NUC
  createDefaultDiskLabeledNodes: true
  # Two copies: one on hal, one on nuc.
  defaultReplicaCount: 2

persistence:
  # k3s local-path stays the default StorageClass; apps ask for "longhorn" explicitly.
  defaultClass: false
  defaultClassReplicaCount: 2

# Recommended by the Longhorn docs when installing with Argo CD.
preUpgradeChecker:
  jobEnabled: false

# CSI helper pods: 2 instead of 3, none has to run on the RPi4 at the moment (4 GB, already full).
csi:
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2

# Backups go to the SSD on HAL over NFS (see ansible/backup-target.yml).
defaultBackupStore:
  backupTarget: nfs://192.168.2.10:/mnt/backup/homelab-longhorn-backup
