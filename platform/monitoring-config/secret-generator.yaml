# KSOPS: decrypt the Grafana admin login and the alert webhook URLs (ntfy, healthchecks.io) during the kustomize build in Argo CD.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./grafana-admin.sops.yaml
  - ./alertmanager-ntfy.sops.yaml
  - ./alertmanager-healthchecks.sops.yaml
