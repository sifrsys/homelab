---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: ntfy
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  route:
    receiver: ntfy-warning
    # One group per alert type, not per instance: fewer messages after a node restart.
    groupBy: ['alertname']
    groupWait: 30s
    groupInterval: 15m
    repeatInterval: 24h
    # Only real problems go to the phone; Watchdog and info alerts stay silent.
    matchers:
      - name: severity
        matchType: =~
        value: warning|critical
    routes:
      # A failure to deliver via ntfy can never be delivered via ntfy; visible in Grafana instead.
      - receiver: blackhole
        matchers:
          - name: alertname
            matchType: =~
            value: AlertmanagerFailedToSendAlerts|AlertmanagerClusterFailedToSendAlerts
      - receiver: ntfy-critical
        groupInterval: 5m
        repeatInterval: 4h
        matchers:
          - name: severity
            matchType: =
            value: critical
  receivers:
    - name: blackhole
    - name: ntfy-warning
      webhookConfigs:
        - urlSecret:
            name: alertmanager-ntfy
            key: url-warning
          sendResolved: true
    - name: ntfy-critical
      webhookConfigs:
        - urlSecret:
            name: alertmanager-ntfy
            key: url-critical
          sendResolved: true
